name: Testes

# Roda em qualquer branch que não seja a main: confere o código e faz uma atualização
# completa com cotações reais, SEM publicar o site.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:           # botão "Run workflow": confere as fontes de reserva sob demanda

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade -r requirements.txt
      - name: Testes automáticos
        run: python -m pytest -q
      - name: Atualização de ensaio com cotações reais (não publica)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m pipeline.construir
      - name: Conferir a base contra as fontes de reserva
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/conferir_reservas.py AAPL NVDA
      - name: Amostra dos números gerados
        run: |
          python - <<'PY'
          import json, glob
          for f in sorted(glob.glob("site/data/*/*/meta.json")):
              m = json.load(open(f))
              print(f)
              for r in m["tickers"] + m["benchmarks"]:
                  print(f"  {r['symbol']:6s} último {r['last_price']:>10} | no ano {r['ytd']:+.1%} | drawdown {r['dd_current']:.1%} | pior {r['dd_max']:.1%} em {r['dd_max_trough']} | fase {r['phase']} | {r['source']}")
          s = json.load(open("site/data/saude.json"))
          for m in s["mercados"]:
              for a, v in m["ativos"].items():
                  for av in v.get("avisos", []):
                      print(f"  aviso {a}: {av}")
          PY
