name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 19h17 de Brasília, dias úteis (depois do fechamento de Nova York)
  workflow_dispatch:           # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths-ignore: ["status/**", "README.md", "docs/**"]

permissions:
  contents: write   # só para o registro mensal em status/ (mantém o agendamento ativo)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DADOS_REPO: ${{ github.repository }}-dados   # repositório PRIVADO de backup (opcional)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install --upgrade -r requirements.txt

      - name: Testes automáticos
        run: python -m pytest -q

      # Camada 1 da base de cotações: cache do próprio GitHub Actions (não vai para o repositório público).
      - name: Restaurar base de cotações (cache)
        uses: actions/cache/restore@v5
        with:
          path: data/base
          key: base-${{ github.run_id }}
          restore-keys: base-

      # Camada 2 (opcional): repositório privado com histórico versionado. Só roda se o segredo DADOS_TOKEN existir.
      - name: Restaurar base de cotações (repositório privado)
        env:
          DADOS_TOKEN: ${{ secrets.DADOS_TOKEN }}
        run: |
          if [ -z "$DADOS_TOKEN" ]; then echo "Backup privado não configurado (segredo DADOS_TOKEN ausente)."; exit 0; fi
          if git clone --depth 1 "https://x-access-token:${DADOS_TOKEN}@github.com/${DADOS_REPO}.git" /tmp/dados; then
            if [ -d /tmp/dados/base ]; then mkdir -p data/base && cp -a /tmp/dados/base/. data/base/; fi
          else
            echo "::warning::Não consegui abrir o repositório de backup ${DADOS_REPO}. Seguindo só com o cache."
          fi

      - name: Baixar dados e calcular indicadores
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m pipeline.construir

      - name: Salvar base de cotações (cache)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/base
          key: base-${{ github.run_id }}

      - name: Salvar base de cotações (repositório privado)
        if: always()
        env:
          DADOS_TOKEN: ${{ secrets.DADOS_TOKEN }}
        run: |
          if [ -z "$DADOS_TOKEN" ] || [ ! -d /tmp/dados/.git ] || [ ! -d data/base ]; then exit 0; fi
          mkdir -p /tmp/dados/base && cp -a data/base/. /tmp/dados/base/
          cd /tmp/dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Base de cotações $(date -u +%Y-%m-%d)"
            git push -q origin HEAD:main || echo "::warning::Não consegui gravar o backup em ${DADOS_REPO}."
          fi

      # O GitHub desliga agendamentos de repositórios públicos após 60 dias sem atividade.
      # Um commit pequeno por mês evita isso.
      - name: Registro mensal de execução
        run: |
          mkdir -p status
          date -u +"%Y-%m" > status/ultimo_mes_atualizado.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status
          if ! git diff --cached --quiet; then
            git commit -m "Registro mensal de execução"
            git push || echo "push não realizado (sem problema)"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
